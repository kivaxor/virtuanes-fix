name: Build Android APK

on:
push:
paths:
- "*.zip"
- ".github/workflows/android-apk.yml"
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Find project ZIP
    id: source
    shell: bash
    run: |
      ZIP_PATH="$(git log -1 --format= --name-only --diff-filter=ACMR -- '*.zip' | grep -E '^[^/]+\.zip$' | head -n 1)"

      if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
        echo "Tidak menemukan ZIP proyek di root repositori."
        exit 1
      fi

      unzip -t "$ZIP_PATH"
      echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

  - name: Extract source ZIP
    shell: bash
    run: |
      mkdir -p "$RUNNER_TEMP/nes-source"
      unzip -q "${{ steps.source.outputs.zip_path }}" -d "$RUNNER_TEMP/nes-source"

      GRADLEW="$(find "$RUNNER_TEMP/nes-source" -type f -name gradlew -print -quit)"

      if [ -z "$GRADLEW" ]; then
        echo "gradlew tidak ditemukan. ZIP harus berisi proyek Android Gradle."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$GRADLEW")"
      chmod +x "$GRADLEW"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build debug APK
    run: ./gradlew --no-daemon --stacktrace assembleDebug
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: NESLauncher-debug-apk
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 14
